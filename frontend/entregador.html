<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pitstop Entregas | Motoboy</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
    <style>
        /* PALETA PREMIUM DO SISTEMA */
        :root { 
            --bg-main: #0d1117; 
            --bg-card: #161b22; 
            --text-main: #c9d1d9; 
            --text-muted: #8b949e; 
            --border-color: #30363d;
            --accent-green: #56d364;
            --accent-blue: #58a6ff;
            --accent-orange: #e3b341;
        }
        
        body { background: var(--bg-main); color: var(--text-main); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin: 0; padding-bottom: 30px; overflow-x: hidden; }
        
        /* CABEÇALHO ELEGANTE */
        header { background: var(--bg-card); padding: 15px; text-align: center; color: white; font-weight: 800; border-bottom: 1px solid var(--border-color); position: sticky; top: 0; z-index: 100; display: flex; flex-direction: column; align-items: center; gap: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        
        /* TELA DE LOGIN BLINDADA E CENTRALIZADA */
        #tela-login { display: flex; flex-direction: column; justify-content: center; align-items: center; min-height: 80vh; padding: 20px; text-align: center; }
        .login-box { background: var(--bg-card); padding: 35px 25px; border-radius: 16px; border: 1px solid var(--border-color); width: 100%; max-width: 350px; box-shadow: 0 15px 35px rgba(0,0,0,0.4); }
        
        .select-perfil, .input-senha { width: 100%; padding: 14px; background: var(--bg-main); border: 1px solid var(--border-color); color: white; border-radius: 8px; font-size: 15px; margin-top: 15px; box-sizing: border-box; outline: none; transition: 0.2s; }
        .select-perfil:focus, .input-senha:focus { border-color: var(--accent-green); box-shadow: 0 0 0 2px rgba(86, 211, 100, 0.1); }
        
        .btn-login { background: var(--accent-green); color: black; border: none; padding: 14px; border-radius: 8px; width: 100%; font-weight: bold; font-size: 15px; margin-top: 25px; cursor: pointer; transition: 0.2s; box-shadow: 0 4px 10px rgba(86, 211, 100, 0.2); }
        .btn-login:hover { transform: translateY(-2px); box-shadow: 0 6px 15px rgba(86, 211, 100, 0.4); }

        /* CARTEIRA / MÉTRICAS */
        .carteira { background: var(--bg-card); margin: 15px; padding: 15px; border-radius: 12px; display: flex; justify-content: space-around; border: 1px solid var(--border-color); }
        .metrica { text-align: center; }
        .metrica span { font-size: 11px; color: var(--text-muted); text-transform: uppercase; font-weight: bold; }
        .metrica strong { display: block; font-size: 22px; color: var(--accent-green); margin-top: 5px; }

        /* CARDS DE ENTREGA PREMIUM */
        .lista { padding: 15px; display: flex; flex-direction: column; gap: 15px; }
        .card { background: var(--bg-card); border-radius: 12px; padding: 20px; border: 1px solid var(--border-color); border-left: 5px solid var(--accent-blue); box-shadow: 0 8px 20px rgba(0,0,0,0.3); position: relative; }
        
        .status-badge { position: absolute; top: 15px; right: 15px; font-size: 10px; background: rgba(88, 166, 255, 0.1); color: var(--accent-blue); padding: 4px 8px; border-radius: 6px; border: 1px solid rgba(88, 166, 255, 0.3); font-weight: bold; display: flex; align-items: center; gap: 4px; }
        
        .card-nome { margin: 0 0 8px 0; font-size: 18px; color: white; padding-right: 90px; line-height: 1.3; }
        .card-end { font-size: 14px; color: var(--text-muted); margin-bottom: 15px; line-height: 1.4; background: rgba(0,0,0,0.3); padding: 10px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.03); }
        
        /* CAIXA DE PAGAMENTO (TIPO RECIBO) */
        .price-box { display: flex; justify-content: space-between; align-items: center; background: rgba(0,0,0,0.4); padding: 12px; border-radius: 8px; border: 1px dashed var(--border-color); margin-bottom: 15px; }
        .price-label { font-size: 12px; font-weight: bold; text-transform: uppercase; }
        .price-value { font-size: 18px; font-weight: 800; color: white; }

        /* BOTÕES DE AÇÃO */
        .btn-acao { display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; padding: 12px; border-radius: 8px; font-weight: bold; font-size: 14px; cursor: pointer; text-decoration: none; box-sizing: border-box; transition: 0.2s; border: none; margin-bottom: 10px; }
        
        .btn-rota { background: rgba(88, 166, 255, 0.1); color: var(--accent-blue); border: 1px solid rgba(88, 166, 255, 0.3); }
        .btn-whats { background: rgba(86, 211, 100, 0.1); color: var(--accent-green); border: 1px solid rgba(86, 211, 100, 0.3); }
        .btn-concluir { background: var(--accent-green); color: black; margin-bottom: 0; margin-top: 15px; font-size: 15px; }
        
        .btn-acao:active { transform: scale(0.98); }
    </style>
</head>
<body>

    <audio id="som-alerta" preload="auto">
        <source src="https://cdn.pixabay.com/download/audio/2021/08/04/audio_0625c1539c.mp3?filename=success-1-6297.mp3" type="audio/mpeg">
    </audio>

    <header style="display: flex; flex-direction: column; align-items: center; gap: 8px;">
        <img src="./assets/logo-pitstop_burger.png" alt="Logo" style="width: 50px; height: 50px; object-fit: contain;">
        <span>PITSTOP ENTREGAS</span>
    </header>

    <div id="tela-login" style="display: none;">
        <div class="login-box">
            <h2 style="margin-top: 0; color: white;">Bem-vindo!</h2>
            <p style="color: #aaa; font-size: 14px;">Identifique-se para acessar suas entregas:</p>
            
            <input type="text" id="nome-motoboy" class="select-perfil" placeholder="Seu nome cadastrado">

            <input type="password" id="input-senha-moto" class="input-senha" placeholder="Senha (Seu Telefone)">

            <button class="btn-login" onclick="tentarLogin()">Acessar Entregas</button>
        </div>
    </div>

    <div id="tela-entregas" style="display: none;">
        <div style="display: flex; justify-content: space-between; padding: 15px 15px 0 15px; align-items: center;">
            <span style="color: #aaa; font-size: 14px;">Logado como: <strong id="nome-logado" style="color: var(--accent);"></strong></span>
            <button onclick="sairDoApp()" style="background: #333; color: white; border: none; padding: 6px 12px; border-radius: 6px; cursor: pointer; font-size: 12px;">Sair</button>
        </div>
        <div class="carteira" style="justify-content: center;">
            <div class="metrica">
                <span>Entregas Concluídas Hoje</span>
                <strong id="total-entregas" style="font-size: 24px;">0</strong>
            </div>
        </div>

        <div id="lista-cards" class="lista"></div>
    </div>
    

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getFirestore, collection, query, onSnapshot, doc, updateDoc, where } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";
        import { getAuth, getIdTokenResult, onAuthStateChanged, signInWithEmailAndPassword, signOut } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";

        const firebaseConfig = {
          apiKey: "AIzaSyCUjBWv40J0Mp6KsHzWxOwz6hNyWDHOYT8",
          authDomain: "pitstop-burguer.firebaseapp.com",
          projectId: "pitstop-burguer",
          storageBucket: "pitstop-burguer.firebasestorage.app",
          messagingSenderId: "749099939746",
          appId: "1:749099939746:web:1716fc96eb83bb1f7724fb"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);
        const escapeHTML = (value) => String(value ?? '').replace(/[&<>"']/g, (char) => ({
            '&': '&amp;',
            '<': '&lt;',
            '>': '&gt;',
            '"': '&quot;',
            "'": '&#39;'
        }[char]));
        const escapeAttr = escapeHTML;
        const jsArg = (value) => escapeAttr(JSON.stringify(String(value ?? '')));

        let meuNome = null;
        let pararRastreador = null;
        let validandoUsuario = false;
        let rastreadorNome = null;

        function emailTecnicoMotoboy(nome) {
            const identificador = String(nome || '')
                .normalize('NFD')
                .replace(/[\u0300-\u036f]/g, '')
                .toLowerCase()
                .replace(/[^a-z0-9]+/g, '.')
                .replace(/^\.+|\.+$/g, '');

            if (!identificador) throw new Error('Nome de entregador inválido');
            return `${identificador}@entregadores.pitstop.local`;
        }

        function verificarLogin() {
            if (meuNome) {
                document.getElementById('tela-login').style.display = 'none';
                document.getElementById('tela-entregas').style.display = 'block';
                document.getElementById('nome-logado').innerText = meuNome;
                iniciarRastreadorTrabalho();
            } else {
                document.getElementById('tela-login').style.display = 'flex';
                document.getElementById('tela-entregas').style.display = 'none';
            }
        }

        window.tentarLogin = async function() {
            const nomeSelecionado = document.getElementById('nome-motoboy').value.trim();
            const senhaDigitada = document.getElementById('input-senha-moto').value.trim();

            if (!nomeSelecionado) return alert("Informe o seu nome cadastrado!");
            if (!senhaDigitada) return alert("Por favor, digite a sua senha!");

            try {
                await signInWithEmailAndPassword(
                    auth,
                    emailTecnicoMotoboy(nomeSelecionado),
                    senhaDigitada.replace(/\D/g, '')
                );
            } catch (erro) {
                console.error('Falha no login do entregador:', erro);
                alert("Nome ou senha incorretos.");
            }
        }

        // --- A PRANCHETA DO FISCAL (MEMÓRIA DO RADAR) ---
        let entregasConhecidas = [];
        let primeiraLeitura = true;

        // 2. BUSCAR ENTREGAS DO MOTOBOY LOGADO
        function iniciarRastreadorTrabalho() {
            if (rastreadorNome === meuNome && pararRastreador) return;
            if (pararRastreador) pararRastreador();
            rastreadorNome = meuNome;
            const q = query(collection(db, "pedidos"), where("entregador", "==", meuNome));

            pararRastreador = onSnapshot(q, (snapshot) => {
                const lista = document.getElementById('lista-cards');
                lista.innerHTML = '';
                let contagemGeral = 0;
                let entregasAtivas = 0;
                
                let tocouAlarme = false;
                let IDsAtuais = [];

                snapshot.forEach((documento) => {
                    const pedido = documento.data();
                    const id = documento.id;
                    
                    if (pedido.status === "Finalizado") {
                        contagemGeral++;
                    }

                    if (pedido.status === "Saiu para Entrega") {
                        entregasAtivas++;
                        IDsAtuais.push(id); // O fiscal anota o ID atual

                        // --- A VERIFICAÇÃO DO FISCAL ---
                        // Se não for a primeira vez que abre o app E o ID for novidade:
                        if (!primeiraLeitura && !entregasConhecidas.includes(id)) {
                            tocouAlarme = true;
                        }

                        const whatsLimpo = pedido.whatsapp ? pedido.whatsapp.replace(/\D/g, '') : '';
                        
                        // O link oficial de busca do Google Maps para abrir direto no GPS
                        const enderecoCompleto = pedido.endereco + ", Cruzeiro do Sul - AC";
                        const linkMaps = `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(enderecoCompleto)}`;
                        
                        const textoWhats = `Olá ${pedido.cliente}, sou o entregador do Pitstop Burguer! Estou a caminho com o seu pedido.`;
                        const linkWhats = `https://api.whatsapp.com/send?phone=55${whatsLimpo}&text=${encodeURIComponent(textoWhats)}`;

                        // Lógica visual: Se for para cobrar no local, a tag fica vermelha chamativa!
                        const pagamentoPedido = String(pedido.pagamento ?? '');
                        const cobrarNoLocal = (pagamentoPedido === 'pagar-na-entrega' || pagamentoPedido === 'dinheiro' || pagamentoPedido.includes('cartao'));
                        const corPagamento = cobrarNoLocal ? 'var(--text-red)' : 'var(--accent-green)';
                        const textoPagamento = cobrarNoLocal ? '⚠️ COBRAR DO CLIENTE' : '✅ JÁ PAGO NO APP';

                        lista.innerHTML += `
                            <div class="card">
                                <span class="status-badge"><span class="material-symbols-outlined" style="font-size: 14px;">two_wheeler</span> A CAMINHO</span>
                                
                                <h3 class="card-nome">${escapeHTML(pedido.cliente)}</h3>
                                
                                <div class="card-end">
                                    <span class="material-symbols-outlined" style="font-size: 16px; vertical-align: middle; color: var(--text-muted);">location_on</span>
                                    ${escapeHTML(pedido.endereco)}
                                </div>
                                
                                <div class="price-box">
                                    <span class="price-label" style="color: ${corPagamento};">${textoPagamento}</span>
                                    <span class="price-value">${escapeHTML(pedido.totalGeral)}</span>
                                </div>

                                <div style="display: flex; gap: 10px;">
                                    <a href="${escapeAttr(linkMaps)}" target="_blank" rel="noopener noreferrer" class="btn-acao btn-rota">
                                        <span class="material-symbols-outlined" style="font-size: 20px;">navigation</span> Mapa
                                    </a>
                                    <a href="${escapeAttr(linkWhats)}" target="_blank" rel="noopener noreferrer" class="btn-acao btn-whats">
                                        <span class="material-symbols-outlined" style="font-size: 20px;">chat</span> Mensagem
                                    </a>
                                </div>

                                <button class="btn-acao btn-concluir" onclick="finalizarEntrega(${jsArg(id)})">
                                    <span class="material-symbols-outlined" style="font-size: 22px;">check_circle</span> Confirmar Entrega
                                </button>
                            </div>
                        `;
                    }
                });

                // --- O GRITO DO FISCAL (TOCAR ALARME E VIBRAR) ---
                if (tocouAlarme) {
                    const audio = document.getElementById('som-alerta');
                    if(audio) audio.play().catch(e => console.log("Áudio bloqueado:", e));
                    
                    if (navigator.vibrate) navigator.vibrate([500, 200, 500]); // Vibra o telemóvel
                }

                // O fiscal guarda a nova lista de IDs na prancheta para a próxima vez
                entregasConhecidas = [...IDsAtuais];
                primeiraLeitura = false;

                document.getElementById('total-entregas').innerText = contagemGeral;
                //document.getElementById('ganhos-hoje').innerText = (contagemGeral * taxaPorEntrega).toLocaleString('pt-BR', {style: 'currency', currency: 'BRL'});//

                if (entregasAtivas === 0) {
                    lista.innerHTML = '<div style="text-align:center; padding:40px; color:#666;">Tudo limpo! Aguardando novos pedidos... 🥤</div>';
                }
            }, (erro) => {
                console.error('Erro ao carregar entregas:', erro);
                document.getElementById('lista-cards').innerHTML = '<div style="text-align:center; padding:40px; color:#f85149;">Não foi possível carregar suas entregas. Entre novamente.</div>';
            });
        }

        window.finalizarEntrega = async (id) => {
            if (confirm("Confirmar que o pedido foi entregue e pago?")) {
                await updateDoc(doc(db, "pedidos", id), { status: "Finalizado" });
            }
        }

        window.sairDoApp = async function() {
            if(confirm("Deseja sair da sua conta?")) {
                if (pararRastreador) pararRastreador();
                await signOut(auth);
                meuNome = null;
                location.reload();
            }
        }

        onAuthStateChanged(auth, async (user) => {
            if (validandoUsuario) return;

            if (!user) {
                if (pararRastreador) pararRastreador();
                pararRastreador = null;
                rastreadorNome = null;
                meuNome = null;
                verificarLogin();
                return;
            }

            validandoUsuario = true;
            try {
                const token = await getIdTokenResult(user, true);
                if (token.claims.entregador !== true || !token.claims.entregadorNome) {
                    await signOut(auth);
                    throw new Error('Conta sem permissão de entregador');
                }

                meuNome = String(token.claims.entregadorNome);
                verificarLogin();
            } catch (erro) {
                console.error('Falha ao validar entregador:', erro);
                await signOut(auth);
                meuNome = null;
                verificarLogin();
            } finally {
                validandoUsuario = false;
            }
        });
        
    </script>
</body>
</html>
